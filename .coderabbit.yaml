# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Review settings for CodeRabbit. Reviews stay on request only (`@coderabbitai review`).
reviews:
  auto_review:
    enabled: false
  path_filters:
    # Generated by `pnpm api:generate` from the backend's OpenAPI document; review the backend schemas instead.
    - "!frontend/src/api-schema/**"
    - "!frontend/openapi.json"
