[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "champagnefestival-backend"
# Packaging metadata only — not the app release version. This project is run
# from source (uv run / the Docker image), never installed as a distributable
# wheel, so nothing reads this field. The real version lives in /VERSION
# (see app/version.py) and is what app/main.py, the frontend, and Android use.
version = "0.0.0"
description = "FastAPI backend for the Champagnefestival reservation system"
requires-python = ">=3.15"
dependencies = [
  "alembic==1.20.1",
  "aiosqlite==0.22.1",
  "asyncpg==0.32.0",
  "fastapi==0.162.0",
  "fastmcp==4.1.6",
  "httpx==0.28.1",
  "limits==5.8.0",
  "phonenumbers==9.0.42",
  "psycopg[binary]==3.3.8",
  "pydantic[email]==2.14.3",
  "pydantic-settings==2.16.2",
  "pyjwt[crypto]==2.15.1",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.33",
  "qrcode[pil]==8.2",
  "pillow==13.0.0",
  "sqlalchemy[asyncio]==2.1.8",
  "uvicorn[standard]==0.54.0",
  "markdown-it-py==4.3.0",
  "nh3==0.3.7",
  "pywebpush>=2.5.0",
]

[project.optional-dependencies]
sentry = ["sentry-sdk[fastapi]==2.74.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "anyio==4.16.0", "ruff==0.17.4", "ty==0.0.99"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-p no:anyio"
markers = ["anyio: marks tests as anyio-compatible (no-op under asyncio_mode=auto)"]
testpaths = ["tests"]
# Third-party deprecations we cannot fix here; each entry is scoped to the emitting
# module. Drop an entry once its upstream release stops warning.
filterwarnings = [
  # fastmcp's py-key-value-aio protocol is checked by beartype without @runtime_checkable.
  "ignore:.*isn't explicitly decorated with @runtime_checkable:DeprecationWarning:beartype",
]

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
