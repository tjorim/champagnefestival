[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "champagnefestival-backend"
# Packaging metadata only — not the app release version. This project is run
# from source (uv run / the Docker image), never installed as a distributable
# wheel, so nothing reads this field. The real version lives in /VERSION
# (see app/version.py) and is what app/main.py, the frontend, and Android use.
version = "0.0.0"
description = "FastAPI backend for the Champagnefestival reservation system"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "fastmcp==4.0.0b5",
  "httpx==0.28.1",
  "limits==5.8.0",
  "phonenumbers==9.0.38",
  "psycopg[binary]==3.3.4",
  "pydantic[email]==2.13.5",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.13.0",
  "python-dotenv==1.2.3",
  "python-multipart==0.0.32",
  "qrcode[pil]==8.2",
  "slowapi==0.1.10",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
sentry = ["sentry-sdk[fastapi]==2.68.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "anyio==4.14.2", "ruff==0.16.5", "ty==0.0.75"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-p no:anyio"
markers = ["anyio: marks tests as anyio-compatible (no-op under asyncio_mode=auto)"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.rules]
unresolved-attribute = "warn"

[tool.uv]
# fastmcp is intentionally pinned to a prerelease (still pre-1.0 during its
# v4 beta cycle) and exact-requires a matching prerelease of fastmcp-slim, a
# transitive dependency — uv's default prerelease mode doesn't treat that
# transitive requirement as "explicit" consistently across every resolution
# fork, breaking specifically in the `python_full_version >= '3.14'` fork
# (this project's actual Docker runtime — see backend/Dockerfile) whenever
# fastmcp moves to a newer prerelease, which is exactly the update
# Dependabot needs to propose.
#
# `prerelease = "explicit"` plus this open-ended constraint (not an exact
# pin) scopes prerelease-allowance to fastmcp-slim only — every other
# dependency still rejects prereleases — without going stale the way an
# exact-pinned constraint did (Dependabot only bumps the `dependencies`
# entry it's targeting, not a hand-pinned version here). Drop both lines
# once fastmcp reaches a stable 4.0.0 release.
prerelease = "explicit"
constraint-dependencies = ["fastmcp-slim>=4.0.0a1"]
