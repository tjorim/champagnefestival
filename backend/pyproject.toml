[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "champagnefestival-backend"
# Packaging metadata only — not the app release version. This project is run
# from source (uv run / the Docker image), never installed as a distributable
# wheel, so nothing reads this field. The real version lives in /VERSION
# (see app/version.py) and is what app/main.py, the frontend, and Android use.
version = "0.0.0"
description = "FastAPI backend for the Champagnefestival reservation system"
requires-python = ">=3.15"
dependencies = [
  "alembic==1.20.1",
  "aiosqlite==0.22.1",
  "asyncpg==0.32.0",
  "fastapi==0.164.0",
  "fastmcp==4.2.1",
  "httpx==0.28.1",
  "limits==5.8.0",
  "phonenumbers==9.0.44",
  "psycopg[binary]==3.3.9",
  "pydantic[email]==2.14.3",
  "pydantic-settings==2.16.3",
  "pyjwt[crypto]==2.15.1",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.34",
  "qrcode[pil]==8.2",
  "pillow==13.0.0",
  "sqlalchemy[asyncio]==2.1.9",
  "uvicorn[standard]==0.54.0",
  "markdown-it-py==4.3.0",
  "nh3==0.3.8",
  "pywebpush==2.5.0",
]

[project.optional-dependencies]
sentry = ["sentry-sdk[fastapi]==2.75.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "pytest-cov==7.1.0", "anyio==4.16.0", "ruff==0.17.5", "ty==0.0.106"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-p no:anyio"
markers = ["anyio: marks tests as anyio-compatible (no-op under asyncio_mode=auto)"]
testpaths = ["tests"]
# Third-party deprecations we cannot fix here; each entry is scoped to the emitting
# module. Drop an entry once its upstream release stops warning.
filterwarnings = [
  # fastmcp's py-key-value-aio protocol is checked by beartype without @runtime_checkable.
  "ignore:.*isn't explicitly decorated with @runtime_checkable:DeprecationWarning:beartype",
]

# Run with `uv run pytest --cov` (CI does). The floor sits just below the measured total, so coverage cannot regress
# unnoticed; raise it as tests are added and never lower it to land a change.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 93  # measured 93.37% on SQLite; CI also runs the PostgreSQL-only tests
skip_covered = true

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.environment]
python-version = "3.15"
