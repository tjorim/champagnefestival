[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "champagnefestival-backend"
# Packaging metadata only — not the app release version. This project is run
# from source (uv run / the Docker image), never installed as a distributable
# wheel, so nothing reads this field. The real version lives in /VERSION
# (see app/version.py) and is what app/main.py, the frontend, and Android use.
version = "0.0.0"
description = "FastAPI backend for the Champagnefestival reservation system"
requires-python = ">=3.14"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "fastapi==0.142.2",
  "fastmcp==4.0.10",
  "httpx==0.28.1",
  "limits==5.8.0",
  "phonenumbers==9.0.40",
  "psycopg[binary]==3.3.6",
  "pydantic[email]==2.13.5",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.13.0",
  "python-dotenv==1.2.3",
  "python-multipart==0.0.32",
  "qrcode[pil]==8.2",
  "slowapi==0.1.10",
  "sqlalchemy[asyncio]==2.1.2",
  "uvicorn[standard]==0.54.0",
  "markdown-it-py==4.2.0",
  "nh3==0.3.7",
  "pywebpush>=2.5.0",
]

[project.optional-dependencies]
sentry = ["sentry-sdk[fastapi]==2.71.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "anyio==4.15.1", "ruff==0.16.10", "ty==0.0.84"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-p no:anyio"
markers = ["anyio: marks tests as anyio-compatible (no-op under asyncio_mode=auto)"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.rules]
unresolved-attribute = "warn"
