<!doctype html>
<html lang="nl" data-theme-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>%VITE_SITE_TITLE%</title>
    <meta name="title" content="%VITE_SITE_TITLE%" />
    <!--
      This static shell is what crawlers and link-preview bots see (the SPA has not
      rendered yet), so its language must match the base locale (nl, see hreflang
      x-default below and project.inlang/settings.json) rather than defaulting to
      English. Per-locale variants of this shell are tracked separately — see
      https://github.com/tjorim/champagnefestival/issues/936.
    -->
    <meta name="description" content="Een viering van fijne champagne en gemeenschap" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100f0d" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf4e6" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Champagnefestival Organisation" />
    <meta name="keywords" content="champagne, festival, belgium, wine, tasting, event, community" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_PUBLIC_URL%" />
    <meta property="og:title" content="%VITE_SITE_TITLE%" />
    <meta property="og:description" content="Een viering van fijne champagne en gemeenschap" />
    <meta property="og:image" content="%VITE_PUBLIC_URL%/images/og-image.jpg" />
    <meta property="og:locale" content="nl_BE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="fr_BE" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%VITE_PUBLIC_URL%" />
    <meta name="twitter:title" content="%VITE_SITE_TITLE%" />
    <meta name="twitter:description" content="Een viering van fijne champagne en gemeenschap" />
    <meta name="twitter:image" content="%VITE_PUBLIC_URL%/images/og-image.jpg" />

    <!-- Inter is self-hosted (src/styles/fonts.css); preload the subset every page needs. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Language alternates for SEO -->
    <link rel="alternate" hreflang="en" href="%VITE_PUBLIC_URL%/en" />
    <link rel="alternate" hreflang="fr" href="%VITE_PUBLIC_URL%/fr" />
    <link rel="alternate" hreflang="nl" href="%VITE_PUBLIC_URL%" />
    <link rel="alternate" hreflang="x-default" href="%VITE_PUBLIC_URL%" />
    <link rel="canonical" href="%VITE_PUBLIC_URL%" />

    <!--
      Reserved slot the backend fills for GET / and GET /privacy (#992) — a
      server-rendered JSON-LD <script> for those two routes. Inert everywhere
      else (pnpm dev, any route the backend doesn't render): a bare HTML
      comment. See docs/decisions/992-live-public-render.md decision 1.
    -->
    <!--ssr:head-->

    <!-- Hide the disposable server fragment before the JavaScript app paints. -->
    <style>
      @layer components {
        html[data-visual-theme] .site-server-content {
          display: none;
        }
      }
    </style>

    <script>
      (() => {
        // Sets data-theme-mode (the light/dark mode that Tailwind's dark variant and the
        // runtime theme tokens read) before first paint, to avoid a flash. The theme stylesheet
        // itself (colors/layout) is loaded from main.tsx — see useVisualTheme.ts.
        const VISUAL_THEME_KEY = "champagnefestival:visualTheme";
        // Vite injects the shared registry in development and production.
        const THEMES = __VISUAL_THEMES__;
        const VARIANTS = THEMES.map((theme) => theme.value);
        let visualTheme = "refresh";
        try {
          const stored = window.localStorage.getItem(VISUAL_THEME_KEY);
          if (VARIANTS.includes(stored)) visualTheme = stored;
        } catch {}
        document.documentElement.dataset.visualTheme = visualTheme;

        // The theme stylesheet is attached by main.tsx once the bundle has run; fetching it now
        // takes that round trip off the first paint. Keep the path in step with useVisualTheme.ts.
        const themePreload = document.createElement("link");
        themePreload.rel = "preload";
        themePreload.as = "style";
        themePreload.href = "/themes/theme-" + visualTheme + ".css";
        document.head.appendChild(themePreload);

        const query = window.matchMedia("(prefers-color-scheme: light)");
        const applyTheme = () => {
          const current = document.documentElement.dataset.visualTheme;
          const definition = THEMES.find((theme) => theme.value === current) ?? THEMES[0];
          const mode = definition.colorMode;
          const colors = definition.themeColors;
          document.documentElement.dataset.themeMode =
            mode === "system" ? (query.matches ? "light" : "dark") : mode;
          document
            .querySelector('meta[name="theme-color"][media="(prefers-color-scheme: dark)"]')
            ?.setAttribute("content", colors.dark);
          document
            .querySelector('meta[name="theme-color"][media="(prefers-color-scheme: light)"]')
            ?.setAttribute("content", colors.light);
        };
        applyTheme();
        query.addEventListener?.("change", applyTheme);
      })();
    </script>
  </head>

  <body>
    <!--
      Reserved slot the backend fills for GET / and GET /privacy (#992) —
      crawler-visible content (FAQ/schedule or the privacy policy body),
      replaced wholesale once React mounts (createRoot, not hydrateRoot — no
      hydration-mismatch failure mode to design around). Inert everywhere
      else: a bare HTML comment inside the same fallback div React replaces.
    -->
    <div id="root"><!--ssr:content--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
