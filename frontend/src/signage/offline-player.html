<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{start}}</title>
    <style>
      @layer components {
        html,
        body {
          margin: 0;
          width: 100%;
          height: 100%;
          background: black;
          color: white;
          font-family: Arial, sans-serif;
        }
        img {
          position: absolute;
          width: 100%;
          height: 100%;
          object-fit: contain;
        }
        img[hidden] {
          display: none;
        }
        button,
        p {
          position: relative;
          margin: 1rem;
        }
        button {
          font: inherit;
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <button type="button">{{start}}</button>
    <p>{{setup}}</p>
    <script id="playlist" type="application/json">
      {{playlist}}
    </script>
    <script src="player.js"></script>
  </body>
</html>
