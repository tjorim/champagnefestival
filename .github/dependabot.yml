version: 2
updates:
  - package-ecosystem: "npm"
    allow:
      - dependency-type: all
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "platform:frontend"
    versioning-strategy: "increase"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      # msw is test-only; its @inquirer/* and tldts* transitives move with it
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
          - "msw"
          - "@inquirer/*"
          - "tldts"
          - "tldts-core"
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxc-parser"
      i18n:
        patterns:
          - "@inlang/*"
      # oidc-client-ts is the engine react-oidc-context wraps
      oidc:
        patterns:
          - "oidc-client-ts"
          - "react-oidc-context"
      # tailwindcss and its Vite plugin share one release train
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      playwright:
        patterns:
          - "@playwright/*"
          - "@axe-core/playwright"
      jest-axe:
        patterns:
          - "jest-axe"
          - "@types/jest-axe"
      dayjs:
        patterns:
          - "dayjs"
      maps:
        patterns:
          - "leaflet"
          - "react-leaflet"
          - "@types/leaflet"
      # Group TanStack table packages (must update together or pipelines fail)
      tanstack-table:
        patterns:
          - "@tanstack/react-table"
          - "@tanstack/table-core"
      # Group TanStack DB packages (both depend on @tanstack/db; mismatched versions cause type errors)
      tanstack-db:
        patterns:
          - "@tanstack/react-db"
          - "@tanstack/query-db-collection"
      # Group TanStack Query packages (must share one @tanstack/query-core; duplicate copies break QueryClient types)
      tanstack-query:
        patterns:
          - "@tanstack/react-query"
          - "@tanstack/query-persist-client-core"
      # Group dnd-kit packages (share internal deps; mismatched versions cause type errors)
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
      # Group TanStack Router with its serialisation packages (seroval is router-core's serializer)
      tanstack-router:
        patterns:
          - "@tanstack/react-router"
          - "@tanstack/router-*"
          - "@tanstack/history"
          - "seroval"
          - "seroval-plugins"
      # @tanstack/charts pulls in the d3-* modules and svelte as runtime dependencies
      charts:
        patterns:
          - "@tanstack/charts"
          - "d3-*"
          - "svelte"
      # Babel packages are transitive and must resolve to one version per major line
      babel:
        patterns:
          - "@babel/*"
      # shadcn CLI and the icon set its generated components use; validate together (docs/ui-maintenance.md)
      shadcn:
        patterns:
          - "shadcn"
          - "@shadcn/*"
          - "lucide-react"
      base-ui:
        patterns:
          - "@base-ui/*"

  # Monitor uv-managed Python dependencies for backend API
  - package-ecosystem: "uv"
    allow:
      - dependency-type: all
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "platform:backend"
      - "python"
    versioning-strategy: "increase"
    groups:
      # fastmcp pulls in mcp and mcp-types; keep them moving together
      # cyclopts is a direct dependency of fastmcp; keep its pinned range in step
      fastmcp:
        patterns:
          - "fastmcp"
          - "fastmcp-slim"
          - "mcp"
          - "mcp-types"
          - "cyclopts"
      # Keep Pydantic, its validation core, and settings integration together
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
      python-quality:
        patterns:
          - "ruff"
          - "ty"
          - "pytest"
          - "pytest-asyncio"
      # psycopg and psycopg-binary ship as a pair; the direct dependency is psycopg[binary]
      psycopg:
        patterns:
          - "psycopg*"
      # Token and JOSE libraries are security-sensitive; review them together
      auth:
        patterns:
          - "authlib"
          - "joserfc"
          - "pyjwt"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(android)"
      include: "scope"
    labels:
      - "dependencies"
      - "platform:android"
    groups:
      # AGP, Kotlin and KSP must match each other; a split update breaks the build
      android-build:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp"

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(compose)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # One SHA-pinned bump PR for all non-CodeQL actions; CodeQL keeps its own group
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action/*"
      codeql:
        patterns:
          - "github/codeql-action/*"
