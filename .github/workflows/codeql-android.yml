name: CodeQL Android

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/codeql-android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/codeql-android.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CodeQL Kotlin support
        id: codeql-kotlin
        run: |
          set -euo pipefail
          kotlin_version="$(awk -F '"' '/^kotlin = / { print $2 }' android/gradle/libs.versions.toml)"
          max_supported="2.4.0"
          if printf '%s\n%s\n' "${kotlin_version}" "${max_supported}" | sort -V -C; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping CodeQL java-kotlin analysis: Kotlin ${kotlin_version} is newer than CodeQL's current Kotlin support."
          fi

      - name: Initialize CodeQL
        if: steps.codeql-kotlin.outputs.supported == 'true'
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Set up JDK 17
        if: steps.codeql-kotlin.outputs.supported == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        if: steps.codeql-kotlin.outputs.supported == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build for analysis
        if: steps.codeql-kotlin.outputs.supported == 'true'
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin

      - name: Perform CodeQL analysis
        if: steps.codeql-kotlin.outputs.supported == 'true'
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:java-kotlin
