name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default. Only `draft` writes (contents) and only `publish-library` gets an OIDC token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every tjorim/* repository releases with the same job graph; a repository leaves out what it does not
# have. Publishing is always manual: the last job only drafts the GitHub release.
#
#   validate         tag == VERSION == every versioned file == CHANGELOG        (all repositories)
#   *-checks         the tests that gate this repository's release                (repository specific)
#   publish-library  build and publish the Python client to PyPI, once per tag    (Daynest, Travel)
#   package-*        build release assets (HACS archive, Android APK)             (Daynest, Travel)
#   draft            changelog notes + assets become a draft GitHub release       (all repositories)

jobs:
  validate:
    name: Validate tag, versions and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false

      # The tag, VERSION, frontend/package.json and the CHANGELOG must agree (scripts/release.mjs;
      # configuration in release.config.json). The backend and Android read VERSION directly.
      - name: Validate tag, versions and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs check --tag "$TAG"

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    needs: validate
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_champagne
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_champagne
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_champagne
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_champagne"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format)
        run: uv run ruff format --check .

      - name: Typecheck (ty)
        run: uv run ty check .

      - name: Migrate (alembic upgrade head)
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (Paraglide + tsc)
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  draft:
    name: Create draft release
    needs: [validate, backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false

      - name: Extract release notes from the changelog
        run: node scripts/release.mjs notes > "$RUNNER_TEMP/release-notes.md"

      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          body_path: ${{ runner.temp }}/release-notes.md
