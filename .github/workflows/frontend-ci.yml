name: Frontend CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate UI maintenance inventory
        working-directory: frontend
        run: |
          node --test scripts/ui-maintenance.verify.mjs scripts/ui-imports.verify.mjs
          node scripts/ui-maintenance.mjs check
          node scripts/ui-imports.mjs

      - name: Audit interface strings and catalogues
        run: pnpm run locale:audit

      - name: Typecheck (Paraglide + tsc)
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Bundle size budget
        run: pnpm bundle:test && pnpm bundle:check

  # E2E runs as four shards (one worker each, because concurrent cold Vite loads cause
  # contention), the production signage suite in parallel, and an aggregate job. The
  # aggregate keeps the required check name `Frontend / E2E Tests (Chromium)`. See
  # frontend/e2e/README.md ("CI sharding") for the measurements behind these numbers.
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # A stuck or systematically failing run (retries double it) must not occupy a runner for hours.
    timeout-minutes: 30
    # Self-contained: start alongside lint/unit tests/build to shorten CI latency.
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Paraglide messages
        run: pnpm run paraglide:compile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      # Pull requests and pushes to main run the default theme only (every width and colour
      # scheme of it); the other five themes repeat the same specs and are temporary until one
      # theme is settled. Manual runs (`gh workflow run frontend-ci.yml --ref <branch>`) run
      # every theme.
      - name: Run E2E tests
        env:
          E2E_SKIP_THEMES: classic|riviera|cuvee|remuage|millesime
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm exec playwright test --shard=${{ matrix.shard }}/4 --reporter=github,html
          else
            pnpm exec playwright test --grep-invert "$E2E_SKIP_THEMES" --shard=${{ matrix.shard }}/4 --reporter=github,html
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

  e2e-signage:
    name: E2E signage (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Paraglide messages
        run: pnpm run paraglide:compile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run signage E2E tests
        run: pnpm exec playwright test --config playwright.signage.config.ts --reporter=github,html

      - name: Upload signage Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-signage
          path: frontend/playwright-report/
          retention-days: 7

  # The required status check. It fails if any shard or the signage suite failed, was
  # cancelled or never ran, so a hidden shard failure cannot pass the CI gate.
  e2e:
    name: E2E Tests (Chromium)
    needs: [e2e-shard, e2e-signage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every E2E suite to have passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
